<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Snake Case 转换器</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 20px;
            }

            .container {
                width: 100%;
                max-width: 500px;
                background-color: white;
                border-radius: 16px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
                padding: 30px;
            }

            .header {
                text-align: center;
                margin-bottom: 30px;
            }

            .header h1 {
                color: #2c3e50;
                font-size: 28px;
                margin-bottom: 8px;
            }

            .header p {
                color: #7f8c8d;
                font-size: 16px;
            }

            .input-section {
                margin-bottom: 20px;
            }

            .input-section label {
                display: block;
                margin-bottom: 8px;
                color: #2c3e50;
                font-weight: 600;
                font-size: 14px;
            }

            .input-section input {
                width: 100%;
                padding: 14px;
                border: 2px solid #e0e6ed;
                border-radius: 10px;
                font-size: 16px;
                transition: all 0.3s ease;
                outline: none;
            }

            .input-section input:focus {
                border-color: #3498db;
                box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
            }

            .result-section {
                margin-bottom: 30px;
            }

            .result-section label {
                display: block;
                margin-bottom: 8px;
                color: #2c3e50;
                font-weight: 600;
                font-size: 14px;
            }

            .result-container {
                background-color: #f8f9fa;
                border: 2px solid #e0e6ed;
                border-radius: 10px;
                padding: 14px;
                min-height: 52px;
                display: flex;
                align-items: center;
                font-size: 16px;
                font-family: "Courier New", monospace;
                color: #2c3e50;
                word-break: break-all;
            }

            .result-container.empty {
                color: #95a5a6;
                font-style: italic;
            }

            .convert-btn {
                width: 100%;
                background: linear-gradient(to right, #4776e6, #8e54e9);
                color: white;
                border: none;
                border-radius: 10px;
                padding: 16px;
                font-size: 16px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
                margin-bottom: 15px;
            }

            .convert-btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 7px 15px rgba(142, 84, 233, 0.3);
            }

            .convert-btn:active {
                transform: translateY(0);
            }

            .copy-btn {
                width: 100%;
                background-color: #2ecc71;
                color: white;
                border: none;
                border-radius: 10px;
                padding: 16px;
                font-size: 16px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
            }

            .copy-btn:hover {
                background-color: #27ae60;
            }

            .copy-btn:disabled {
                background-color: #bdc3c7;
                cursor: not-allowed;
            }

            .copy-btn.copied {
                background-color: #3498db;
            }

            .examples {
                margin-top: 25px;
                padding-top: 20px;
                border-top: 1px solid #eee;
            }

            .examples h3 {
                color: #2c3e50;
                font-size: 16px;
                margin-bottom: 12px;
            }

            .example-list {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
            }

            .example-btn {
                background-color: #f1f3f9;
                border: 1px solid #e0e6ed;
                border-radius: 6px;
                padding: 8px 14px;
                font-size: 14px;
                cursor: pointer;
                transition: all 0.2s ease;
            }

            .example-btn:hover {
                background-color: #e8edf7;
                transform: translateY(-1px);
            }

            .toast {
                position: fixed;
                top: 20px;
                right: 20px;
                background-color: #2ecc71;
                color: white;
                padding: 12px 24px;
                border-radius: 8px;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
                transform: translateX(150%);
                transition: transform 0.3s ease;
                z-index: 1000;
            }

            .toast.show {
                transform: translateX(0);
            }

            .toast.error {
                background-color: #e74c3c;
            }

            @media (max-width: 600px) {
                .container {
                    padding: 20px;
                }

                .header h1 {
                    font-size: 24px;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <h1>Snake Case 转换器</h1>
                <p>将Java枚举、类名等转换为snake_case格式</p>
            </div>

            <div class="input-section">
                <label for="inputText">输入名称：</label>
                <input
                    type="text"
                    id="inputText"
                    placeholder="例如: OrderSubStatus.VALIDATING 或 OrderSubEvent"
                    autocomplete="off"
                />
            </div>

            <div class="result-section">
                <label for="resultText">Snake Case 结果：</label>
                <div id="resultText" class="result-container empty">
                    输入内容后自动转换
                </div>
            </div>

            <button class="convert-btn" onclick="convertToSnake()">
                立即转换
            </button>
            <button class="copy-btn" onclick="copyResult()" disabled>
                点击复制结果
            </button>

            <div class="examples">
                <h3>常用示例：</h3>
                <div class="example-list">
                    <button
                        class="example-btn"
                        onclick="loadExample('OrderSubStatus.VALIDATING')"
                    >
                        OrderSubStatus.VALIDATING
                    </button>
                    <button
                        class="example-btn"
                        onclick="loadExample('OrderSubEvent.START_EXECUTION')"
                    >
                        OrderSubEvent.START_EXECUTION
                    </button>
                    <button
                        class="example-btn"
                        onclick="loadExample('PaymentStatusEnum.PAID')"
                    >
                        PaymentStatusEnum.PAID
                    </button>
                    <button
                        class="example-btn"
                        onclick="loadExample('UserAccountStatus')"
                    >
                        UserAccountStatus
                    </button>
                    <button
                        class="example-btn"
                        onclick="loadExample('CamelCaseExample')"
                    >
                        CamelCaseExample
                    </button>
                </div>
            </div>
        </div>

        <div id="toast" class="toast"></div>

        <script>
            // 获取DOM元素
            const inputText = document.getElementById("inputText");
            const resultText = document.getElementById("resultText");
            const copyBtn = document.querySelector(".copy-btn");
            const toast = document.getElementById("toast");

            // 自动转换函数（输入时实时转换）
            inputText.addEventListener("input", function () {
                convertToSnake();
            });

            // 转换函数
            function convertToSnake() {
                const input = inputText.value.trim();

                if (!input) {
                    resultText.textContent = "输入内容后自动转换";
                    resultText.classList.add("empty");
                    copyBtn.disabled = true;
                    return;
                }

                // 转换为snake_case
                const snakeCase = toSnakeCase(input);

                // 显示结果
                resultText.textContent = snakeCase;
                resultText.classList.remove("empty");
                copyBtn.disabled = false;
                copyBtn.classList.remove("copied");
                copyBtn.textContent = "点击复制结果";
            }

            // 核心转换函数
            function toSnakeCase(str) {
                if (!str) return "";

                // 移除多余空格
                let cleanStr = str.trim();

                // 如果包含点号（如 OrderSubStatus.VALIDATING），只取最后一部分
                if (cleanStr.includes(".")) {
                    const parts = cleanStr.split(".");
                    cleanStr = parts[parts.length - 1];
                }

                // 将camelCase或PascalCase转换为snake_case
                // 处理连续大写字母的情况（如 "XMLHttpRequest" -> "xml_http_request"）
                let result = cleanStr
                    .replace(/([A-Z]+)([A-Z][a-z])/g, "$1_$2") // 处理连续大写
                    .replace(/([a-z\d])([A-Z])/g, "$1_$2") // 处理camelCase
                    .replace(/[-\s]/g, "_") // 将连字符和空格替换为下划线
                    .toLowerCase(); // 全部转为小写

                // 移除可能的前导或尾随下划线
                result = result.replace(/^_+|_+$/g, "");

                return result;
            }

            // 复制结果到剪贴板
            function copyResult() {
                const result = resultText.textContent + ".rs";

                if (!result || result === "输入内容后自动转换") {
                    showToast("没有可复制的内容", true);
                    return;
                }

                navigator.clipboard
                    .writeText(result)
                    .then(() => {
                        // 复制成功
                        copyBtn.classList.add("copied");
                        copyBtn.textContent = "✓ 已复制！";
                        showToast("已复制到剪贴板");

                        // 3秒后恢复按钮状态
                        setTimeout(() => {
                            copyBtn.classList.remove("copied");
                            copyBtn.textContent = "点击复制结果";
                        }, 2000);
                    })
                    .catch((err) => {
                        // 复制失败，使用备用方法
                        console.error("复制失败:", err);
                        fallbackCopyText(result);
                    });
            }

            // 备用复制方法（兼容旧浏览器）
            function fallbackCopyText(text) {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.opacity = "0";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();

                try {
                    const successful = document.execCommand("copy");
                    if (successful) {
                        copyBtn.classList.add("copied");
                        copyBtn.textContent = "✓ 已复制！";
                        showToast("已复制到剪贴板");

                        setTimeout(() => {
                            copyBtn.classList.remove("copied");
                            copyBtn.textContent = "点击复制结果";
                        }, 2000);
                    } else {
                        showToast("复制失败，请手动复制", true);
                    }
                } catch (err) {
                    console.error("备用复制方法失败:", err);
                    showToast("复制失败，请手动复制", true);
                }

                document.body.removeChild(textArea);
            }

            // 加载示例
            function loadExample(example) {
                inputText.value = example;
                convertToSnake();
                inputText.focus();
            }

            // 显示提示消息
            function showToast(message, isError = false) {
                toast.textContent = message;
                toast.className = "toast";

                if (isError) {
                    toast.classList.add("error");
                }

                toast.classList.add("show");

                setTimeout(() => {
                    toast.classList.remove("show");
                }, 3000);
            }

            // 页面加载时设置焦点
            window.addEventListener("load", function () {
                inputText.focus();
            });

            // 按Enter键自动转换
            inputText.addEventListener("keypress", function (e) {
                if (e.key === "Enter") {
                    convertToSnake();
                }
            });
        </script>
    </body>
</html>
