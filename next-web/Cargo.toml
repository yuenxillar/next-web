[package]
name = "next-web"
version = "0.2.2"
description = "Macro-driven web application framework for Rust, built on Tokio and Axum"
homepage = "https://crates.io/crates/next-web"
keywords = ["http", "web", "framework"]
readme = "../README.md"
repository = "https://github.com/yuenxillar/next-web"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
next-web-core           = { workspace = true }
next-web-context        = { workspace = true }
next-web-macros         = { workspace = true }
next-web-singletons     = { workspace = true }

next-web-websocket      = { workspace = true, optional = true }
next-web-retry          = { workspace = true, optional = true }
next-web-resilience     = { workspace = true, optional = true }
next-web-open-api       = { workspace = true, optional = true }
next-web-state-machine  = { workspace = true, optional = true }

tokio                   = { workspace = true, features = ["sync", "signal","net", "fs"] }
axum                    = { workspace = true, features = ["http2"] }
axum-core               = { workspace = true }
rustls                  = { workspace = true, optional = true }
tokio-rustls            = { workspace = true, optional = true }
rustls-pemfile          = { workspace = true, optional = true }
axum-prometheus         = { workspace = true, optional = true }
tower-http              = { workspace = true, features = [
    "trace",
    "timeout",
    "limit",
    "cors",
    "catch-panic",
] }
http-body-util          = { workspace = true }
tokio-cron-scheduler    = { workspace = true, optional = true }
rust-embed              = { workspace = true, optional = true }

serde               = { workspace = true }
serde_yaml          = { workspace = true }
serde_json          = { workspace = true }

tokio-util          = { workspace = true }
futures             = { workspace = true }
chrono              = { workspace = true }
chrono-tz           = { workspace = true }
tracing             = { workspace = true }
tracing-appender    = { workspace = true }
tracing-subscriber  = { workspace = true }
flume               = { workspace = true }
validator           = { workspace = true }
inventory           = { workspace = true }

utoipa-swagger-ui   = { workspace = true, optional = true }

reqwest             = { workspace = true, features = ["stream"] }

md5                 = { workspace = true, optional = true }
sha1                = { workspace = true, optional = true }
sha2                = { workspace = true, optional = true }
base64              = { workspace = true, optional = true }
aes-gcm             = { workspace = true, optional = true }
scrypt              = { workspace = true, optional = true }
rand                = { workspace = true, optional = true }
quick-xml           = { workspace = true }

[target.'cfg(windows)'.dependencies]
mimalloc        = { workspace = true }

[target.'cfg(unix)'.dependencies]
jemallocator    = { workspace = true }

[dev-dependencies]
# The tests drive a router without binding a socket.
tower = { workspace = true }
# The test of the resilience auto-configuration needs the crate under test to be
# linked, so that its providers are discovered, and the feature that makes it read
# the application's properties.
next-web-resilience = { workspace = true, features = ["autoconfigure"] }

[features]
default = ["decrypt-properties"]
full = [
    "enable-scheduling",
    "enable-web-security",
    "enable-websocket",
    "enable-retry",
    "enable-i18n",
    "enable-thread-pool",

    "decrypt-properties",
    "enable-open-api",
    "trace-log"
]

tls-rustls  = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile"]

# web
# Installs the layer that runs the `HttpFilter`s registered in the application
# context. The security support itself lives in its own crate, so an
# application that wants it depends on that crate directly.
enable-web-security     = []
enable-websocket        = ["next-web-websocket"]
enable-open-api         = ["next-web-open-api", "utoipa-swagger-ui", "next-web-macros/open-api"]
enable-scheduling       = ["tokio-cron-scheduler"]
enable-retry            = ["next-web-retry"]
enable-resilience       = ["next-web-resilience", "next-web-resilience/autoconfigure"]
enable-prometheus       = ["axum-prometheus"]
enable-i18n             = []
enable-state-machine    = ["next-web-state-machine"]
enable-thread-pool      = []

embed-resources         = ["next-web-macros/embed-resources", "next-web-core/embed-resources", "dep:rust-embed"]
embed-resources-debug   = ["embed-resources", "rust-embed/debug-embed"]


digester                = ["dep:md5", "dep:sha1", "dep:sha2"]
decrypt-properties      = ["aes-gcm", "dep:base64", "scrypt", "rand"]

trace-log               = ["next-web-core/trace-log"]
