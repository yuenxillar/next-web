next:
  gateway:
    server:
      bind: "0.0.0.0:8080"
      threads: 0
      graceful_shutdown: 30s
      keepalive: 60s
      admin:
        enabled: true
        bind: "127.0.0.1:9001"
    logging:
      level: info
      format: text
      access_log: true
    upstream:
      connect_timeout: 2s
      read_timeout: 30s
      write_timeout: 30s
      idle_timeout: 60s
      tls:
        verify_cert: true
        verify_hostname: true
    error:
      format: json
      request_id_header: X-Request-Id
    trusted_proxies: []
    breakers:
      user-service:
        enabled: true
        failure_threshold: 10
        wait_duration_in_open_state: 5s
        half_open_permits: 1
    routes:
      # Load balanced route with a breaker and per-route rate limiting.
      - id: user-service
        uri: "lb://user-service"
        order: 100
        predicates:
          - Path=/api/users/**
          - Method=GET,POST
        filters:
          - StripPrefix=1
          - AddRequestHeadersIfNotPresent=X-Gateway, next-web
          - RequestRateLimiter=100
          - CircuitBreaker=user-service
        upstreams:
          - addr: "127.0.0.1:18081"
            weight: 2
          - addr: "127.0.0.1:18082"
            weight: 1
        metadata:
          client:
            connect_timeout: 1s
            read_timeout: 10s
            write_timeout: 10s
      # Plain HTTP route that rewrites the prefix away.
      - id: echo
        uri: "http://127.0.0.1:18080"
        order: 200
        predicates:
          - Path=/echo/**
        filters:
          - RewritePath=/echo/(?<rest>.*), /${rest}
          - SecureHeaders
