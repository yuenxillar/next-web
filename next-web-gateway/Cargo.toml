[package]
name = "next-web-gateway"
version = "0.1.0"
edition = "2024"

# The two rust lints the design requires (S5). `unreachable_pub` is deliberately
# not enabled yet: the crate exposes an internal surface that its own integration
# tests and the admin listener consume, and trimming it needs a `pub` ->
# `pub(crate)` sweep tracked in the readiness ledger.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[[bin]]
name = "next-web-gateway"
path = "src/bin/next_web_gateway.rs"

[dependencies]
pingora         = { workspace = true }
pingora-limits  = { workspace = true}

tokio           = { workspace = true, features = ["fs", "time"] }

serde           = { workspace = true }
serde_yaml      = { workspace = true }
serde_json      = { workspace = true }
serde_path_to_error = { workspace = true }
async-trait     = { workspace = true }
regex           = { workspace = true }
clap            = { workspace = true, features = ["env"] }

ipnetwork       = { workspace = true }
chrono          = { workspace = true }
chrono-tz       = { workspace = true }
hashbrown       = { workspace = true }
bytes           = { workspace = true }
form_urlencoded = { workspace = true }
rand            = { workspace = true }
uuid            = { workspace = true }

tracing             = { workspace = true }
tracing-subscriber  = { workspace = true }

[dev-dependencies]
futures             = { workspace = true }
tokio-rustls        = { workspace = true }
rustls              = { workspace = true }
rustls-pemfile      = { workspace = true }

[features]
default = []
