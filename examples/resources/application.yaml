next:
  server:
    context_path: "/app"
    port: 11000
    address: 127.0.0.1
  application:
    name: "NextWebApplication"

  messages:
    base_name: "/messages"

  # The resources the web layer serves: the templates a view renders and the
  # files a dispatch answers with. The cache they are read into is limited here,
  # so an application can raise the limits of a large deployment.
  resources:
    cache:
      max_file_size: 5mb
      max_total_size: 64mb
      panic_on_overflow: false

  data:
    redis:
      host: "192.168.1.19"
      port: 6379
      password: "123"

  xxl_job:
    server_address: "127.0.0.1:11300"
    access_token: "null"
    app_name: ${next.application.name}
    log_path: "/app/next/xxl_job"

  tests:
    version: "1.0.0"
    model: "test"
    enable: true
    date: "2021-12-20"

  logging:
    format: "%Y-%m-%d %H:%M:%S%.3f"
    level: info
    # file:
    #   name: next.log

  feature:
    enabled: true

  open_api:
    title: "Next Web Examples API"
    version: "0.1.0"
    description: "The API of the next-web examples."
    terms_of_service: "https://github.com/yuenxillar/next-web"
    license:
      name: "MIT OR Apache-2.0"
      url: "https://github.com/yuenxillar/next-web/blob/main/LICENSE-MIT"
    contact:
      name: "Listening"
      email: "yuenxillar@163.com"
