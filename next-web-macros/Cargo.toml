[package]
name = "next-web-macros"
version = "0.2.0"
edition = "2021"
description = "Provide a series of commonly used macros"
license.workspace = true

[lib]
proc-macro = true

[dependencies]
next-web-context = { workspace = true }

syn = { workspace = true, features = ["full"] }
quote = { workspace = true }
proc-macro2 = { workspace = true }
from-attr = { workspace = true }
inventory = { workspace = true }

[features]
default = ["data", "translation", "auto-register"]

data = []
api-doc = []
translation = []
embed-resources = []
auto-register = []
