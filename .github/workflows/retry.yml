name: retry

on:
  # Only main on push: a branch with an open pull request is covered by `pull_request` below, so
  # pushing a feature branch would otherwise run the same work twice.
  push:
    branches: ["main"]
    paths:
      - "next-web-retry/**"
      - "next-web/**"
      - "next-web-ai/**"
      - "examples/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/retry.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: retry-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  retry:
    name: retry (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Toolchain
        run: rustc -vV && cargo -vV

      - name: Format
        run: cargo fmt -p next-web-retry --check

      - name: Clippy
        # `--no-deps` keeps the gate on this crate: the workspace has pre-existing clippy
        # findings in next-web-context and next-web-core, and `-D warnings` would fail on them.
        run: cargo clippy -p next-web-retry --all-targets --no-deps -- -D warnings

      - name: Test
        run: cargo test -p next-web-retry

      - name: Docs
        run: cargo doc -p next-web-retry --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  consumers:
    name: consumers (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"

      - uses: Swatinem/rust-cache@v2

      - name: The facade feature
        run: cargo check -p next-web --features enable-retry

      - name: The AI crate
        run: cargo check -p next-web-ai

      - name: The retry example
        run: cargo check -p next-web-examples --bin retry

      - name: The metrics example
        run: cargo check -p next-web-examples --bin retry_metrics

  deny:
    name: deny (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Dependency policy
        # Informational, and deliberately not red: the workspace carries long-standing duplicate
        # versions (`multiple-versions = "deny"` in deny.toml) and a narrow license allow-list, so
        # this reports rather than blocks. `||` keeps the check green while the findings stay in
        # the log and as a warning annotation. Remove the `||` and `continue-on-error` once the
        # policy is aligned and the check is promoted to required (plan Task 3).
        run: cargo deny check advisories bans licenses sources || echo "::warning::cargo-deny reported findings; see the log above"
