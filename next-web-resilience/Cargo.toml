[package]
name = "next-web-resilience"
version = "0.1.0"
description = "Resilience patterns for Next Web applications: circuit breaker, rate limiter, bulkhead, retry and time limiter"
rust-version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["resilience", "circuit-breaker", "rate-limiter", "bulkhead", "retry"]

[dependencies]
next-web-core              = { workspace = true }
next-web-resilience-macros = { workspace = true, optional = true }

tokio         = { workspace = true, features = ["sync", "time"] }
tracing       = { workspace = true }
thiserror     = { workspace = true }
serde         = { workspace = true }
dashmap       = { workspace = true }
rand          = { workspace = true }
parking_lot   = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "time", "macros", "rt-multi-thread", "test-util"] }

[features]
default = ["macros"]
# The attribute macros — `#[rate_limiter]`, `#[circuit_breaker]`, `#[bulkhead]`,
# `#[time_limiter]`, `#[retry]` — re-exported from `next-web-resilience-macros`.
# Turn them off with `default-features = false` for a runtime-only build.
macros = ["dep:next-web-resilience-macros"]

[lints]
workspace = true
