[package]
name = "next-web-core"
version = "0.1.6"
description = "Core library for the Next Web framework, providing essential web server and middleware abstractions."
license.workspace = true
repository.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
next-web-context    = { workspace = true }

axum                = { workspace = true }
tokio               = { workspace = true, features = ["sync"]}

serde               = { workspace = true }
serde_yaml          = { workspace = true }
serde_path_to_error = { workspace = true }

tracing         = { workspace = true }
thiserror       = { workspace = true }
dyn-clone       = { workspace = true }
async-trait     = { workspace = true }
sha2            = { workspace = true }
headers         = { workspace = true, optional = true }
arc-swap        = { workspace = true }
dashmap         = { workspace = true }
uuid            = { workspace = true }
regex           = { workspace = true }
form_urlencoded = { workspace = true }
indexmap        = { workspace = true }

[features]
default = ["trace-log", "http-request"]
http-request = ["headers"]

embed-resources = []
dev = []

trace-log = []
