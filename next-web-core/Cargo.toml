[package]
name = "next-web-core"
version = "0.1.5"
edition.workspace = true
description = "Core library for the Next Web framework, providing essential web server and middleware abstractions."
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
axum            = { workspace = true }
tokio           = { workspace = true, features = ["sync"]}

serde           = { workspace = true }
serde_yaml      = { workspace = true }

thiserror       = { workspace = true }
dyn-clone       = { workspace = true }
serde_json      = { workspace = true }
encoding        = { workspace = true }
clap            = { workspace = true }
async-trait     = { workspace = true }
tracing         = { workspace = true }
# validator       = { workspace = true }
sha2            = { workspace = true }
reqwest         = { workspace = true, features = ["json", "gzip"]}
sys-locale      = { workspace = true }
headers         = { workspace = true, optional = true }
urlencoding     = { workspace = true }
inventory       = { workspace = true }
chrono          = { workspace = true, features = ["serde"] }
arc-swap        = { workspace = true }
dashmap         = { workspace = true }
uuid            = { workspace = true }
regex           = { workspace = true }

# tower-layer = "0.3.3"
# tower-service = "0.3.3"

[features]
default = ["trace-log", "http-request"]
http-request = ["headers"]

embed-resources = []
dev = []

trace-log = []
